# Extensão local de descoberta; o formato normativo OKF está em index.md.
okf_version: "0.2"
system:
  name: "workflow-dev"
  version: "0.1.0"
  stack:
    application: "a definir na primeira spec"
    tooling: ["Git", "Bash", "Node.js >= 18", "Specify CLI 1.0.6", "Codex skills"]
knowledge_version: "0.1.0"
last_synced_commit: null
# Lista YAML de domínios (vazia até a primeira feature da aplicação).
# Campos: id, path (relativo ao bundle), depends_on, source_paths.
domains: []
quality:
  tests:
    approach: "TDD: vermelho, verde, refatoração"
    minimum_coverage_percent: 80
    critical_scenarios: "100% dos cenários de aceitação"
  lint:
    required: true
    warnings_allowed: 0
    command: "a definir conforme a stack no plan.md"
  types:
    strict: true
    implicit_any_allowed: false
